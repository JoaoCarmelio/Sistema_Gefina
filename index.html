

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <title>Gefina - Faturas</title>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        table {
            border: none;
            text-align: center;
            padding: 10px;


        }

        tr{
    
            background-color: rgba(255, 0, 0, 0.34);
            
            
        }

        th {
            padding: 5px;
            background-color: red;
            
        }

        td {
            padding: 10px;
           
        }

      
    </style>

   

</head>

<body>

    <h1>Faturas</h1>

    <div>

    </div>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js">

    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js">

    </script>

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">

    </script>


    <script type="text/babel">
        const root = document.querySelector('div');



       const App = (props) => {
        const invoices = [
            
            {
                id: 1,
                amount: 125000,
                status: 'pending',
                issueDate: '2026-06-01',
                dueDate: '2026-06-15',
                customer: { id: 1, name: 'Construtora Meridiano', email: 'contato@meridiano.com.br' },
            },
            {
                id: 2,
                amount: 348000,
                status: 'paid',
                issueDate: '2026-05-12',
                dueDate: '2026-06-11',
                customer: { id: 1, name: 'Construtora Meridiano', email: 'contato@meridiano.com.br' },
            },
            {
                id: 3,
                amount: 96500,
                status: 'pending',
                issueDate: '2026-06-20',
                dueDate: '2026-07-20',
                customer: { id: 2, name: 'Gráfica Aurora', email: 'contato@graficaaurora.com.br' },
            },
        ];

          function statusLabel(status) {
            return status === 'paid' ? 'pago' : 'pendente';
        }

        return (
             <>
              <table border = '5px'>
                       <thead>
                           <tr>
                               <th>
                                   Cliente
                               </th>
                               <th>
                                   Valor
                               </th>
                               <th>
                                   Data de emissao
                               </th>
                               <th>
                                   Data de vencimento
                               </th>
                               <th>
                                   Status
                               </th>
                           </tr>
                       </thead>

                       <tbody>
                        {invoices.map((invoice)=> {
                            return <tr key={invoice.id}>
                            <td>{invoice.customer.name}</td>
                            <td>{invoice.amount}</td>
                            <td>{invoice.issueDate}</td>
                            <td>{invoice.dueDate}</td>
                            <td>{statusLabel(invoice.status)}</td>
                            </tr>
                        })}

                       </tbody>
                   </table>

               
            </>
        );
           
        
       };

        ReactDOM.createRoot(root).render(<App myName='joao'/>)
        
        


    </script>

    <script>
 
        const invoices = [
            
            {
                id: 1,
                amount: 125000,
                status: 'pending',
                issueDate: '2026-06-01',
                dueDate: '2026-06-15',
                customer: { id: 1, name: 'Construtora Meridiano', email: 'contato@meridiano.com.br' },
            },
            {
                id: 2,
                amount: 348000,
                status: 'paid',
                issueDate: '2026-05-12',
                dueDate: '2026-06-11',
                customer: { id: 1, name: 'Construtora Meridiano', email: 'contato@meridiano.com.br' },
            },
            {
                id: 3,
                amount: 96500,
                status: 'pending',
                issueDate: '2026-06-20',
                dueDate: '2026-07-20',
                customer: { id: 2, name: 'Gráfica Aurora', email: 'contato@graficaaurora.com.br' },
            },
        ];

        const tableBody = document.querySelector('tbody');

        function statusLabel(status) {
            return status === 'paid' ? 'pago' : 'pendente';
        }
        for (let i = 0; i < invoices.length; i++) {

            const invoice = invoices[i];

            const row = document.createElement('tr');

            const client = document.createElement('td');
            client.textContent = invoice.customer.name;

            row.appendChild(client);

             const amount = document.createElement('td');
             amount.textContent = invoice.amount;

            row.appendChild(amount);

             const issueDate = document.createElement('td');
             issueDate.textContent = invoice.issueDate

            row.appendChild(issueDate);

             const dueDate = document.createElement('td');
             dueDate.textContent = invoice.dueDate;
            row.appendChild(dueDate);

             const status = document.createElement('td');
             status.textContent = statusLabel(invoice.status);

            row.appendChild(status);

            tableBody.appendChild(row)






        }
       
    </script>
</body>

</html>
